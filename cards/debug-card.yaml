type: custom:button-card
entity: select.work_mode
triggers_update: "all"
show_name: false
show_icon: false
show_state: false

# ---------------------------------------------------------
# 1. CSS (STYL VAULT-TEC)
# ---------------------------------------------------------
styles:
  card:
    - height: auto
    - min-height: 450px
    - background-color: "transparent"
    - background-image: >
        radial-gradient(circle at center, rgba(0,50,0,0.1) 0%, rgba(0,0,0,0.8) 100%),
        repeating-linear-gradient(transparent 0px, transparent 2px, rgba(0, 255, 0, 0.25) 3px, rgba(0, 255, 0, 0.25) 4px)
    - background-size: "100% 100%"
    - border: "4px solid #2a2a2a"
    - border-radius: 15px
    - box-shadow: "inset 0 0 30px rgba(0,255,0,0.15), 0 0 20px rgba(0,0,0,0.8)"
    - color: "#00ff00"
    - font-family: "Courier New, monospace"
    - text-shadow: "0 0 4px #00ff00, 0 0 8px rgba(0,200,0,0.6)"
    - padding: "15px"
    - overflow: hidden
    - animation: "crt-flicker 0.15s infinite"

  grid:
    - grid-template-areas: '"header" "data"'
    - grid-template-columns: 1fr
    - grid-template-rows: 40px 1fr
    - gap: 10px

  custom_fields:
    header:
      - border-bottom: "2px solid rgba(0, 255, 0, 0.7)"
      - font-size: 20px
      - font-weight: bold
      - letter-spacing: 2px
      - display: flex
      - align-items: center
      - justify-content: center
      - margin-bottom: 10px

    data:
      - display: flex
      - flex-direction: column
      - justify-content: flex-start
      - align-items: flex-start
      - text-align: left
      - font-size: 11px
      - line-height: 1.4

# ---------------------------------------------------------
# 2. HTML & LOGIKA (JS)
# ---------------------------------------------------------
custom_fields:
  header: >
    [[[ return "DIAGNOSTICS MODE"; ]]]

  data: >
    [[[
      // --- 1. POBIERANIE DANYCH (INPUT) ---
      var soc = parseFloat(states['sensor.battery_soc_raw']?.state || 0);
      var demand = parseFloat(states['sensor.bms_predicted_demand']?.state || 0);
      var solar_raw = parseFloat(states['sensor.produkcja_energii_dzisiaj_6_13']?.state || 0);
      
      var season = states['sensor.pora_roku']?.state || 'unknown';
      var weather = states['sensor.openweathermap_condition']?.state || 'unknown';
      var temp = parseFloat(states['sensor.openweathermap_temperature']?.state || 99);

      // --- 2. STAŁE (SAFETY FIRST v1.2) ---
      var CAPACITY = 20.0;
      var SAFETY_MULT = 1.5;
      var FLOOR_PERC = 40.0;
      var SOLAR_CONF = 0.5;

      // --- 3. LOGIKA OBLICZEŃ (JS VERSION) ---
      
      // A. Cel Ładowania
      var target_demand = demand * SAFETY_MULT;
      var target_floor = CAPACITY * (FLOOR_PERC / 100.0);
      var target_final = Math.min(Math.max(target_demand, target_floor), CAPACITY);
      
      // B. Stan obecny
      var energy_in_batt = (soc / 100.0) * CAPACITY;
      var needed_gross = Math.max(0, target_final - energy_in_batt);

      // C. Modyfikatory (Logika IF/ELSE)
      var mod_season = 1.0;
      if (season == 'zima') mod_season = 0.7;
      else if (season == 'jesień') mod_season = 0.8;
      else if (season == 'wiosna') mod_season = 0.9;

      var mod_weather = 0.8;
      var w_bad = ['cloudy','rainy','snowy','fog','mist','overcast','drizzle'];
      var w_mid = ['partlycloudy','partly sunny'];
      var w_good = ['clear','sunny'];
      
      if (w_bad.includes(weather)) mod_weather = 0.5;
      else if (w_mid.includes(weather)) mod_weather = 0.7;
      else if (w_good.includes(weather)) mod_weather = 1.0;

      var mod_temp = 0.88;
      if (temp < -10) mod_temp = 0.85;
      else if (temp < 0) mod_temp = 0.92;
      else if (temp < 15) mod_temp = 1.0;
      else if (temp < 30) mod_temp = 0.95;

      var total_mod = mod_season * mod_weather * mod_temp;
      
      // D. Korekta Solarna
      var solar_safe = solar_raw * total_mod * SOLAR_CONF;
      
      // E. Wynik
      var grid_needed = Math.max(0, needed_gross - solar_safe);
      var minutes = Math.ceil((grid_needed / 10.0) * 60 * 1.1);

      // --- 4. RENDEROWANIE HTML ---
      return `
        <div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
          
          <div style="border: 1px solid rgba(0,255,0,0.4); padding: 5px; background: rgba(0,50,0,0.3);">
            <div style="font-weight:bold; border-bottom: 1px dashed rgba(0,255,0,0.3); margin-bottom: 5px;">ENVIRONMENT FACTORS</div>
            <table style="width:100%; text-align:left;">
              <tr><td>SEASON (${season}):</td><td style="text-align:right">x${mod_season.toFixed(2)}</td></tr>
              <tr><td>WEATHER (${weather}):</td><td style="text-align:right">x${mod_weather.toFixed(2)}</td></tr>
              <tr><td>TEMP (${temp}°C):</td><td style="text-align:right">x${mod_temp.toFixed(2)}</td></tr>
              <tr style="color:#ffff00;"><td><b>TOTAL MOD:</b></td><td style="text-align:right"><b>${total_mod.toFixed(3)}</b></td></tr>
            </table>
          </div>

          <div style="border: 1px solid rgba(0,255,0,0.4); padding: 5px; background: rgba(0,50,0,0.3);">
            <div style="font-weight:bold; border-bottom: 1px dashed rgba(0,255,0,0.3); margin-bottom: 5px;">SOLAR CONFIDENCE (50%)</div>
            <div style="display:flex; justify-content:space-between;">
              <span>FORECAST RAW:</span><span>${solar_raw.toFixed(2)} kWh</span>
            </div>
            <div style="display:flex; justify-content:space-between; color:#ffff00;">
              <span>SAFE FORECAST:</span><span><b>-${solar_safe.toFixed(2)} kWh</b></span>
            </div>
          </div>

          <div style="border: 1px solid rgba(0,255,0,0.4); padding: 5px; background: rgba(0,50,0,0.3);">
            <div style="font-weight:bold; border-bottom: 1px dashed rgba(0,255,0,0.3); margin-bottom: 5px;">TARGET CALCULATION</div>
            <table style="width:100%; text-align:left;">
              <tr><td>DEMAND RAW:</td><td style="text-align:right">${demand.toFixed(2)} kWh</td></tr>
              <tr><td>SAFETY (x1.5):</td><td style="text-align:right">${target_demand.toFixed(2)} kWh</td></tr>
              <tr><td>FLOOR (40%):</td><td style="text-align:right">${target_floor.toFixed(2)} kWh</td></tr>
              <tr style="border-top: 1px solid rgba(0,255,0,0.3);">
                <td><b>FINAL TARGET:</b></td><td style="text-align:right"><b>${target_final.toFixed(2)} kWh</b></td>
              </tr>
            </table>
          </div>

          <div style="margin-top: 5px; padding: 5px; background: rgba(0,255,0,0.1); border: 2px solid #00ff00; text-align: center;">
            <div style="font-size: 10px; letter-spacing: 1px;">NET GRID DEMAND</div>
            <div style="font-size: 24px; font-weight: bold; text-shadow: 0 0 10px #00ff00;">${grid_needed.toFixed(2)} kWh</div>
            <div style="font-size: 10px;">Est. Time: ${minutes} min</div>
          </div>

        </div>
      `;
    ]]]

extra_styles: |
  @keyframes crt-flicker {
    0% { opacity: 0.98; text-shadow: 0 0 4px #00ff00; }
    50% { opacity: 1; text-shadow: 0 0 6px #00ff00, 0 0 10px rgba(0,255,0,0.4); }
    100% { opacity: 0.99; text-shadow: 0 0 5px #00ff00; }
  }