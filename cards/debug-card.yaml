type: custom:button-card
entity: select.work_mode
triggers_update: "all"
show_name: false
show_icon: false
show_state: false

# ---------------------------------------------------------
# 1. CSS (BORG COLLECTIVE STYLE)
# ---------------------------------------------------------
styles:
  card:
    - height: auto
    - min-height: 450px
    - background-color: "rgba(0, 5, 8, 0.75)"
    - background-image: >
        linear-gradient(135deg, rgba(0,255,200,0.03) 25%, transparent 25%),
        linear-gradient(225deg, rgba(0,255,200,0.03) 25%, transparent 25%),
        linear-gradient(45deg, rgba(0,255,200,0.03) 25%, transparent 25%),
        linear-gradient(315deg, rgba(0,255,200,0.03) 25%, transparent 25%),
        repeating-linear-gradient(0deg, rgba(0,200,180,0.04) 0px, transparent 1px, transparent 20px),
        repeating-linear-gradient(90deg, rgba(0,200,180,0.04) 0px, transparent 1px, transparent 20px)
    - background-size: "40px 40px, 40px 40px, 40px 40px, 40px 40px, 20px 20px, 20px 20px"
    - border: "1px solid rgba(0, 220, 180, 0.35)"
    - border-radius: 2px
    - box-shadow: "inset 0 0 40px rgba(0,180,160,0.06), 0 0 15px rgba(0,0,0,0.6), 0 0 1px rgba(0,220,180,0.3)"
    - color: "rgba(0, 220, 180, 0.9)"
    - font-family: "'Share Tech Mono', 'Courier New', monospace"
    - text-shadow: "0 0 3px rgba(0,220,180,0.5)"
    - padding: "16px"
    - overflow: hidden
    - animation: "borg-pulse 4s ease-in-out infinite"
    - clip-path: "polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px))"

  grid:
    - grid-template-areas: '"header" "data"'
    - grid-template-columns: 1fr
    - grid-template-rows: 36px 1fr
    - gap: 8px

  custom_fields:
    header:
      - border-bottom: "1px solid rgba(0, 220, 180, 0.3)"
      - font-size: 13px
      - font-weight: 400
      - letter-spacing: 4px
      - display: flex
      - align-items: center
      - justify-content: center
      - text-transform: uppercase
      - color: "rgba(0, 220, 180, 0.7)"

    data:
      - display: flex
      - flex-direction: column
      - justify-content: flex-start
      - align-items: flex-start
      - text-align: left
      - font-size: 11px
      - line-height: 1.5

# ---------------------------------------------------------
# 2. HTML & LOGIKA (JS)
# ---------------------------------------------------------
custom_fields:
  header: >
    [[[
      return `<span style="opacity:0.4; margin-right:8px;">&#9670;</span>BORG DIAGNOSTICS<span style="opacity:0.4; margin-left:8px;">&#9670;</span>`;
    ]]]

  data: >
    [[[
      // --- 1. INPUT DATA ---
      var soc = parseFloat(states['sensor.battery_soc_raw']?.state || 0);
      var demand = parseFloat(states['sensor.bms_predicted_demand']?.state || 0);
      var solar_raw = parseFloat(states['sensor.solcast_pv_forecast_prognoza_na_dzisiaj']?.state || 0);

      var season = states['sensor.pora_roku']?.state || 'unknown';
      var weather = states['sensor.openweathermap_condition']?.state || 'unknown';
      var temp = parseFloat(states['sensor.openweathermap_temperature']?.state || 99);

      var pred_source = states['sensor.bms_predicted_demand']?.attributes?.source || 'unknown';
      var pred_confidence = states['sensor.bms_predicted_demand']?.attributes?.confidence || 'unknown';
      var pred_method = states['sensor.bms_predicted_demand']?.attributes?.method || 'unknown';

      // --- 2. CONSTANTS ---
      var CAPACITY = 20.0;
      var SAFETY_MULT = 1.5;
      var FLOOR_PERC = 40.0;
      var SOLAR_CONF = 0.5;

      // --- 3. CALCULATIONS ---
      var target_demand = demand * SAFETY_MULT;
      var target_floor = CAPACITY * (FLOOR_PERC / 100.0);
      var target_final = Math.min(Math.max(target_demand, target_floor), CAPACITY);

      var energy_in_batt = (soc / 100.0) * CAPACITY;
      var needed_gross = Math.max(0, target_final - energy_in_batt);

      var mod_season = 1.0;
      if (season == 'winter') mod_season = 0.7;
      else if (season == 'autumn') mod_season = 0.8;
      else if (season == 'spring') mod_season = 0.9;

      var mod_weather = 0.8;
      var w_bad = ['cloudy','rainy','snowy','fog','mist','overcast','drizzle'];
      var w_mid = ['partlycloudy','partly sunny'];
      var w_good = ['clear','sunny'];

      if (w_bad.includes(weather)) mod_weather = 0.5;
      else if (w_mid.includes(weather)) mod_weather = 0.7;
      else if (w_good.includes(weather)) mod_weather = 1.0;

      var mod_temp = 0.88;
      if (temp < -10) mod_temp = 0.85;
      else if (temp < 0) mod_temp = 0.92;
      else if (temp < 15) mod_temp = 1.0;
      else if (temp < 30) mod_temp = 0.95;

      var total_mod = mod_season * mod_weather * mod_temp;
      var solar_safe = solar_raw * total_mod * SOLAR_CONF;
      var grid_needed = Math.max(0, needed_gross - solar_safe);
      var minutes = Math.ceil((grid_needed / 10.0) * 60 * 1.1);

      // --- 4. BORG STYLE HELPERS ---
      var bc = 'rgba(0,220,180,';  // borg cyan base
      var secStyle = `border:1px solid ${bc}0.2); padding:8px; background:${bc}0.03); position:relative;`;
      var secClip = 'clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));';
      var headStyle = `font-size:10px; letter-spacing:2px; color:${bc}0.5); margin-bottom:6px; text-transform:uppercase;`;
      var rowStyle = `display:flex; justify-content:space-between; padding:1px 0;`;
      var dimStyle = `color:${bc}0.55);`;
      var valStyle = `color:${bc}0.95); font-weight:bold;`;
      var accentStyle = `color:rgba(0,255,220,1); font-weight:bold;`;
      var warnStyle = `color:rgba(255,180,0,0.9);`;
      var divider = `<div style="height:1px; background:linear-gradient(90deg, transparent, ${bc}0.15), transparent); margin:4px 0;"></div>`;

      var confColor = pred_confidence === 'high' ? 'rgba(0,255,220,1)' : pred_confidence === 'medium' ? 'rgba(255,200,0,0.9)' : 'rgba(255,120,0,0.9)';
      var srcColor = pred_source === 'prediction-engine' ? 'rgba(0,255,220,1)' : 'rgba(255,120,0,0.9)';

      // --- 5. RENDER ---
      return `
        <div style="width:100%; display:flex; flex-direction:column; gap:8px;">

          <div style="${secStyle} ${secClip}">
            <div style="${headStyle}">&#9655; environment modifiers</div>
            <div style="${rowStyle}"><span style="${dimStyle}">season [${season}]</span><span style="${valStyle}">x${mod_season.toFixed(2)}</span></div>
            <div style="${rowStyle}"><span style="${dimStyle}">weather [${weather}]</span><span style="${valStyle}">x${mod_weather.toFixed(2)}</span></div>
            <div style="${rowStyle}"><span style="${dimStyle}">temp [${temp}°C]</span><span style="${valStyle}">x${mod_temp.toFixed(2)}</span></div>
            ${divider}
            <div style="${rowStyle}"><span style="${accentStyle}">total modifier</span><span style="${accentStyle}">${total_mod.toFixed(3)}</span></div>
          </div>

          <div style="${secStyle} ${secClip}">
            <div style="${headStyle}">&#9655; solar analysis [conf 50%]</div>
            <div style="${rowStyle}"><span style="${dimStyle}">forecast raw</span><span style="${valStyle}">${solar_raw.toFixed(2)} kWh</span></div>
            <div style="${rowStyle}"><span style="${accentStyle}">safe forecast</span><span style="${accentStyle}">-${solar_safe.toFixed(2)} kWh</span></div>
          </div>

          <div style="${secStyle} ${secClip}">
            <div style="${headStyle}">&#9655; target computation</div>
            <div style="${rowStyle}"><span style="${dimStyle}">source</span><span style="color:${srcColor}; font-weight:bold;">${pred_source}</span></div>
            <div style="${rowStyle}"><span style="${dimStyle}">confidence</span><span style="color:${confColor}; font-weight:bold;">${pred_confidence.toUpperCase()}</span></div>
            <div style="${rowStyle}"><span style="${dimStyle}">method</span><span style="${valStyle}">${pred_method}</span></div>
            ${divider}
            <div style="${rowStyle}"><span style="${dimStyle}">demand raw</span><span style="${valStyle}">${demand.toFixed(2)} kWh</span></div>
            <div style="${rowStyle}"><span style="${dimStyle}">safety x1.5</span><span style="${valStyle}">${target_demand.toFixed(2)} kWh</span></div>
            <div style="${rowStyle}"><span style="${dimStyle}">floor 40%</span><span style="${valStyle}">${target_floor.toFixed(2)} kWh</span></div>
            <div style="height:1px; background:${bc}0.25); margin:4px 0;"></div>
            <div style="${rowStyle}"><span style="${accentStyle}">final target</span><span style="${accentStyle}">${target_final.toFixed(2)} kWh</span></div>
          </div>

          <div style="padding:10px; background:linear-gradient(135deg, rgba(0,220,180,0.08), rgba(0,180,160,0.03)); border:1px solid rgba(0,255,220,0.3); text-align:center; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));">
            <div style="font-size:9px; letter-spacing:3px; color:rgba(0,220,180,0.5); text-transform:uppercase;">net grid demand</div>
            <div style="font-size:26px; font-weight:bold; color:rgba(0,255,220,1); text-shadow:0 0 12px rgba(0,255,220,0.4), 0 0 30px rgba(0,220,180,0.15); margin:4px 0;">${grid_needed.toFixed(2)} kWh</div>
            <div style="font-size:9px; letter-spacing:1px; color:rgba(0,220,180,0.45);">est. charge time: ${minutes} min</div>
          </div>

        </div>
      `;
    ]]]

extra_styles: |
  @keyframes borg-pulse {
    0%, 100% { box-shadow: inset 0 0 40px rgba(0,180,160,0.06), 0 0 15px rgba(0,0,0,0.6), 0 0 1px rgba(0,220,180,0.3); }
    50% { box-shadow: inset 0 0 50px rgba(0,180,160,0.09), 0 0 15px rgba(0,0,0,0.6), 0 0 2px rgba(0,220,180,0.45); }
  }