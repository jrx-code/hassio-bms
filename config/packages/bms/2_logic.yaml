# -----------------------------------------------------------------------------
# BMS Package: Logic & Calculations
# Author:      Home Assistant Architect | JrX-Code
# Description: Template sensors calculating demand and charge start times.
# -----------------------------------------------------------------------------

template:
  # 1. PREDICTED DEMAND SENSOR (Unified: prediction-engine → static fallback)
  - sensor:
      - name: "BMS Predicted Demand"
        unique_id: bms_predicted_demand
        unit_of_measurement: "kWh"
        state_class: measurement
        state: >
          {# Priority 1: prediction-engine (MQTT via InfluxDB) #}
          {% set influx = states('sensor.bms_predicted_demand_influx') %}
          {% if influx not in ['unknown', 'unavailable', 'none', ''] %}
            {{ influx | float(0) }}
          {% else %}
            {# Priority 2: Static seasonal fallback #}
            {% set next_rising = states('sensor.sun_next_rising') %}
            {% if next_rising in ['unknown', 'unavailable', 'none'] %}
              0
            {% else %}
              {% set rising_local = next_rising | as_datetime | as_local %}
              {% set target_local = rising_local.replace(hour=13, minute=0, second=0, microsecond=0) %}
              {% set diff_hours = (target_local - rising_local).total_seconds() / 3600 %}
              {% set season = states('sensor.pora_roku') | lower %}
              {% set factors = {
                'spring': 1.3,
                'summer': 1.0,
                'autumn': 1.3,
                'winter': 1.8
              } %}
              {% set factor = factors.get(season, 1.8) %}
              {{ (diff_hours * factor) | round(2) }}
            {% endif %}
          {% endif %}
        attributes:
          source: >
            {% set influx = states('sensor.bms_predicted_demand_influx') %}
            {% if influx not in ['unknown', 'unavailable', 'none', ''] %}
              prediction-engine
            {% else %}
              static-seasonal
            {% endif %}
          confidence: >
            {% set influx = states('sensor.bms_predicted_demand_influx') %}
            {% if influx not in ['unknown', 'unavailable', 'none', ''] %}
              {{ state_attr('sensor.bms_predicted_demand_influx', 'confidence') | default('unknown') }}
            {% else %}
              low
            {% endif %}
          method: >
            {% set influx = states('sensor.bms_predicted_demand_influx') %}
            {% if influx not in ['unknown', 'unavailable', 'none', ''] %}
              {{ state_attr('sensor.bms_predicted_demand_influx', 'method') | default('unknown') }}
            {% else %}
              static_seasonal
            {% endif %}

  # 2. START TIME SENSORS (clamped to tariff windows)
  - sensor:
      - name: "BMS Start Time 06:00"
        unique_id: bms_start_time_06_00
        device_class: timestamp
        state: >
          {% from 'bms.jinja' import calculate_start_time %}
          {% set raw_str = calculate_start_time(
              '06:00',
              states('sensor.battery_soc_foxess_modbus')|float(0)
          ) | trim %}
          {% set raw = raw_str | as_datetime %}
          {% if raw is not none %}
            {# Clamp: night tariff starts at 22:30 (7h30m before 06:00) #}
            {% set target = today_at('06:00') %}
            {% if target < now() %}{% set target = target + timedelta(days=1) %}{% endif %}
            {% set earliest = target - timedelta(hours=7, minutes=30) %}
            {% if raw < earliest %}{{ earliest.isoformat() }}{% else %}{{ raw.isoformat() }}{% endif %}
          {% else %}
            {{ raw_str }}
          {% endif %}

      - name: "BMS Start Time 15:00"
        unique_id: bms_start_time_15_00
        device_class: timestamp
        state: >
          {% from 'bms.jinja' import calculate_start_time %}
          {% set raw_str = calculate_start_time(
              '15:00',
              states('sensor.battery_soc_foxess_modbus')|float(0)
          ) | trim %}
          {% set raw = raw_str | as_datetime %}
          {% if raw is not none %}
            {# Clamp: afternoon tariff starts at 13:00 (2h before 15:00) #}
            {% set target = today_at('15:00') %}
            {% if target < now() %}{% set target = target + timedelta(days=1) %}{% endif %}
            {% set earliest = target - timedelta(hours=2) %}
            {% if raw < earliest %}{{ earliest.isoformat() }}{% else %}{{ raw.isoformat() }}{% endif %}
          {% else %}
            {{ raw_str }}
          {% endif %}

  # 2b. CHARGE DURATION SENSORS (numeric, for Grafana timeseries)
  - sensor:
      - name: "BMS Night Charge Duration"
        unique_id: bms_night_charge_duration
        unit_of_measurement: "min"
        state_class: measurement
        state: >
          {% set st = states('sensor.bms_start_time_06_00_2') | as_datetime %}
          {% if st is not none %}
            {% set target = today_at('06:00') %}
            {% if target < now() %}{% set target = target + timedelta(days=1) %}{% endif %}
            {% set diff = ((target - st).total_seconds() / 60) | round(0) %}
            {{ [0, diff] | max }}
          {% else %}
            0
          {% endif %}

      - name: "BMS Afternoon Charge Duration"
        unique_id: bms_afternoon_charge_duration
        unit_of_measurement: "min"
        state_class: measurement
        state: >
          {% set st = states('sensor.bms_start_time_15_00_2') | as_datetime %}
          {% if st is not none %}
            {% set target = today_at('15:00') %}
            {% if target < now() %}{% set target = target + timedelta(days=1) %}{% endif %}
            {% set diff = ((target - st).total_seconds() / 60) | round(0) %}
            {{ [0, diff] | max }}
          {% else %}
            0
          {% endif %}

  # 3. HYSTERESIS SWITCH
  - binary_sensor:
      - name: "BMS Charge Required"
        unique_id: bms_charge_required
        state: "{{ states('sensor.battery_soc_foxess_modbus')|float(100) < 95 }}"
